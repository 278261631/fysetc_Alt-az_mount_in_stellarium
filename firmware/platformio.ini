; FYSETC E4 (ESP32-WROOM-32, 4x onboard TMC2209, CH340 -> COM7)
; Alt-Az mount controller: LX200 serial protocol + FastAccelStepper + TMC2209 UART
;
; Build : pio run
; Flash : pio run -t upload        (upload_port=COM7 below; Lead owns the serial port)
; Monitor: pio device monitor
;
; NOTE: UART0 (GPIO1 TX / GPIO3 RX, the CH340 bridge) is the LX200 channel @9600.
;       UART1 (GPIO21 RX / GPIO22 TX) is the shared TMC2209 single-wire bus @115200.

[env:fysetc_e4]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
; Runtime LX200 link is 9600 8N1 (Stellarium 23.4 hard-codes 9600 for its
; direct LX200 serial connection).  Flashing uses the ESP32 ROM bootloader at
; upload_speed below, which is independent of the runtime baud rate.
monitor_speed = 9600
upload_port = COM7
upload_speed = 460800
; UART0 is the LX200 channel: no boot-time debug output on it.
; Set -DLX200_BOOT_BANNER=1 to enable the one-time bench banner instead.
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    gin66/FastAccelStepper@0.30.15
    teemuatlut/TMCStepper@0.7.3
